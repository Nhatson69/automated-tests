name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:

# Évite d'empiler plusieurs runs pour la même branche / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- CI : exercice 3 ----------
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Donner les droits
        run: chmod +x ./gradlew
      - name: Construire et vérifier
        run: ./gradlew build
      - name: Publier le livrable
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: build/libs/app.jar
      - name: Publier les rapports (même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports
          path: build/reports/

  # (gardez ici votre job "performance" de l'exercice 3, inchangé)

  # ---------- Livraison : image Docker ----------
  docker:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Récupérer le livrable testé
        uses: actions/download-artifact@v8
        with:
          name: app
          path: build/libs
      - name: Construire l'image
        run: docker build -t demo:${{ github.sha }} .
      - name: Lancer le conteneur
        run: docker run -d --name demo -p 8080:8080 demo:${{ github.sha }}
      - name: Test de fumée
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/hello && exit 0
            sleep 2
          done
          docker logs demo
          exit 1
 # ----- Exercice 5 : scanner l'image, puis l'application en marche -----
      - name: Scanner l'image (Trivy)
        # Épinglé par SHA : les tags de trivy-action ont été détournés en mars 2026
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true     # ne bloque que si un correctif existe
          exit-code: '1'           # une faille HIGH ou CRITICAL fait échouer le job
      - name: Scanner l'application en marche (ZAP baseline)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080/hello
          allow_issue_writing: false   # rapport en artefact, pas d'issue GitHub

  # ---------- Déploiements ----------
  deploy-test:
    name: Deploy TEST (Pull Request)
    needs: [docker, dependency-review, secret-scan]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: ansible-playbook -i ansible/inventory/test.ini ansible/playbook.yml -e image_tag=${{ github.sha }}

  deploy-dev:
    name: Deploy DEV (push sur develop)
    needs: [docker, secret-scan]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: ansible-playbook -i ansible/inventory/dev.ini ansible/playbook.yml -e image_tag=${{ github.sha }}

  deploy-prod:
    name: Deploy PROD (push sur main)
    needs: [docker, secret-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: ansible-playbook -i ansible/inventory/prod.ini ansible/playbook.yml -e image_tag=${{ github.sha }}

  dependency-submission:
    runs-on: ubuntu-26.04
    permissions:
      contents: write        # nécessaire pour envoyer le graphe à GitHub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Envoyer le graphe des dépendances
        uses: gradle/actions/dependency-submission@v6
  
  dependency-review:
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 60   # attendre (1 min max) que le graphe de la branche cible soit disponible

  secret-scan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write   # Gitleaks commente la PR quand il trouve un secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # tout l'historique, pas seulement le dernier commit
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

           